<style>
  :root{
    --bg-1:#0f0c29;
    --bg-2:#1b0e3d;
    --bg-3:#170a2c;
    --pink:#fe2c55;
    --cyan:#25f4ee;
    --card:rgba(255,255,255,0.055);
    --card-border:rgba(255,255,255,0.09);
    --text:#f4f2fb;
    --muted:#a9a3c2;
    --good:#33e0a3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(254,44,85,0.20), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(37,244,238,0.16), transparent 40%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    color:var(--text);
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  header.top{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 2px;}
  header.top .date{font-size:0.95rem;color:var(--muted);text-transform:capitalize;}
  header.top .greet{font-size:1.35rem;font-weight:700;margin-top:2px;}
  .streak-badge{
    display:flex;align-items:center;gap:6px;
    background:linear-gradient(135deg, rgba(254,44,85,0.25), rgba(37,244,238,0.20));
    border:1px solid var(--card-border);
    padding:8px 14px;border-radius:999px;font-weight:700;font-size:0.95rem;
    white-space:nowrap;
  }
  .streak-badge.zero{opacity:0.55;}
  .streak-badge .fire{font-size:1.1rem;filter:drop-shadow(0 0 6px rgba(254,44,85,0.6));}

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:20px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  .card h2{margin:0 0 14px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card h2 .tag{margin-left:auto;font-size:0.75rem;font-weight:600;color:var(--muted);}

  /* video card */
  .video-row{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0 4px;}
  .video-count{
    font-size:3.1rem;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(120deg, var(--pink), var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    min-width:120px;text-align:center;
  }
  .round-btn{
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
    font-size:1.5rem;font-weight:700;color:#fff;
    background:linear-gradient(135deg, var(--pink), #ff6b8a);
    box-shadow:0 6px 18px rgba(254,44,85,0.35);
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .round-btn.minus{background:linear-gradient(135deg,#3a3560,#4d4680);box-shadow:0 6px 18px rgba(0,0,0,0.3);}
  .round-btn:active{transform:scale(0.9);}
  .video-msg{text-align:center;color:var(--muted);font-size:0.9rem;margin-top:6px;min-height:1.2em;}
  .week-bars{display:flex;justify-content:center;align-items:flex-end;gap:8px;height:46px;margin-top:16px;}
  .week-bars .bar-col{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1 1 0;min-width:0;}
  .week-bars .bar{width:100%;border-radius:6px;background:rgba(255,255,255,0.12);transition:height .25s ease, background .25s ease;}
  .week-bars .bar.hit{background:linear-gradient(180deg, var(--cyan), var(--pink));}
  .week-bars .lbl{font-size:0.62rem;color:var(--muted);}
  .week-bars .bar-col.today .lbl{color:var(--text);font-weight:800;}

  /* money card */
  .progress-track{height:16px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;margin:10px 0 8px;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg, var(--cyan), var(--pink));transition:width .4s ease;}
  .money-figures{display:flex;justify-content:space-between;font-size:0.9rem;color:var(--muted);margin-bottom:14px;}
  .money-figures b{color:var(--text);}
  .money-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=number], input[type=date], input[type=text]{
    background:rgba(255,255,255,0.07);border:1px solid var(--card-border);color:var(--text);
    padding:10px 12px;border-radius:12px;font-size:0.95rem;outline:none;width:120px;
  }
  input[type=text]{width:auto;flex:1;}
  .btn{
    border:none;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;color:#fff;
    background:linear-gradient(135deg, var(--pink), var(--cyan));
    transition:transform .12s ease;
  }
  .btn:active{transform:scale(0.95);}
  .btn.ghost{background:rgba(255,255,255,0.08);color:var(--text);}
  .chip-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--card-border);background:rgba(255,255,255,0.06);color:var(--text);
    padding:7px 13px;border-radius:999px;font-size:0.85rem;cursor:pointer;font-weight:600;
  }
  .chip:active{transform:scale(0.94);}

  /* pnl */
  .pnl-weekday-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .pnl-weekday-labels span{text-align:center;font-size:0.62rem;color:var(--muted);}
  .pnl-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .pnl-day{border-radius:12px;padding:8px 1px;text-align:center;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);min-width:0;}
  .pnl-day .num{font-size:0.6rem;color:var(--muted);}
  .pnl-day .amt{font-size:0.58rem;font-weight:800;margin-top:4px;color:var(--muted);line-height:1.15;word-break:break-word;}
  .pnl-day.pos{background:rgba(51,224,163,0.16);border-color:rgba(51,224,163,0.4);}
  .pnl-day.pos .amt{color:var(--good);}
  .pnl-day.neg{background:rgba(254,44,85,0.16);border-color:rgba(254,44,85,0.4);}
  .pnl-day.neg .amt{color:var(--pink);}
  .pnl-day.today{box-shadow:0 0 0 2px #fff inset;}

  /* habits */
  .habit-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,0.06);}
  .habit-row:last-of-type{border-bottom:none;}
  .habit-check{
    width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,255,255,0.25);
    flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;background:transparent;
  }
  .habit-check.on{background:linear-gradient(135deg, var(--good), var(--cyan));border-color:transparent;}
  .habit-check.on::after{content:"✓";color:#0a1f18;font-weight:900;font-size:0.9rem;}
  .habit-name{flex:1;font-size:0.95rem;}
  .habit-name.on{color:var(--muted);text-decoration:line-through;}
  .habit-del{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 6px;opacity:0.6;}
  .habit-del:hover{opacity:1;color:var(--pink);}
  .add-habit-row{display:flex;gap:8px;margin-top:12px;}

  /* heatmap */
  .heatmap-scroll{overflow-x:auto;padding-bottom:4px;}
  .heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;}
  .cell{width:13px;height:13px;border-radius:3px;background:rgba(255,255,255,0.06);}
  .cell.l1{background:rgba(37,244,238,0.35);}
  .cell.l2{background:rgba(37,244,238,0.6);}
  .cell.l3{background:linear-gradient(135deg, var(--cyan), var(--pink));}
  .cell.today{box-shadow:0 0 0 2px #fff inset;}
  .heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:0.72rem;color:var(--muted);}
  .heat-legend .cell{width:11px;height:11px;}

  details.settings{color:var(--muted);}
  details.settings summary{cursor:pointer;font-weight:700;font-size:0.9rem;color:var(--text);list-style:none;display:flex;align-items:center;gap:6px;}
  details.settings summary::-webkit-details-marker{display:none;}
  details.settings summary::before{content:"⚙";}
  .settings-grid{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
  .settings-grid label{font-size:0.85rem;display:flex;flex-direction:column;gap:6px;}

  .confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:999;pointer-events:none;border-radius:2px;}
  @keyframes fall{
    to{transform:translateY(105vh) rotate(360deg);opacity:0.3;}
  }
  @media (max-width:420px){
    .video-count{font-size:2.5rem;min-width:90px;}
    .round-btn{width:46px;height:46px;font-size:1.3rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="date" id="todayDate"></div>
      <div class="greet" id="greetMsg">Погнали 💪</div>
    </div>
    <div class="streak-badge" id="streakBadge"><span class="fire">🔥</span><span id="streakVal">0</span> дн.</div>
  </header>

  <section class="card">
    <h2>🎬 Видео в TikTok <span class="tag" id="videoGoalTag">цель: 4/день</span></h2>
    <div class="video-row">
      <button class="round-btn minus" id="videoMinus">−</button>
      <div class="video-count" id="videoCount">0/4</div>
      <button class="round-btn" id="videoPlus">+</button>
    </div>
    <div class="video-msg" id="videoMsg"></div>
    <div class="week-bars" id="weekBars"></div>
  </section>

  <section class="card">
    <h2>📸 Видео в Instagram <span class="tag" id="igGoalTag">цель: 2/день</span></h2>
    <div class="video-row">
      <button class="round-btn minus" id="igMinus">−</button>
      <div class="video-count" id="igCount">0/2</div>
      <button class="round-btn" id="igPlus">+</button>
    </div>
    <div class="video-msg" id="igMsg"></div>
    <div class="week-bars" id="igWeekBars"></div>
  </section>

  <section class="card">
    <h2>💶 Финансовая цель <span class="tag" id="moneyDeadlineTag"></span></h2>
    <div class="progress-track"><div class="progress-fill" id="moneyFill" style="width:0%"></div></div>
    <div class="money-figures">
      <span>Заработано: <b id="moneyCurrentLbl">0 €</b></span>
      <span>Цель: <b id="moneyTargetLbl">3000 €</b></span>
    </div>
    <div class="money-figures" style="margin-bottom:0;">
      <span id="moneyDaysLeft"></span>
      <span id="moneyPerDay"></span>
    </div>
  </section>

  <section class="card">
    <h2>💹 PNL — заработок по дням</h2>
    <div class="pnl-weekday-labels">
      <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
    </div>
    <div class="pnl-week" id="pnlWeek"></div>
    <div class="money-controls" style="margin-top:16px;">
      <input type="number" id="earnedInput" step="10" placeholder="заработал сегодня, €">
      <button class="btn" id="earnedSaveBtn">Сохранить</button>
    </div>
    <div class="chip-row">
      <button class="chip" data-add="-10">−10 €</button>
      <button class="chip" data-add="-5">−5 €</button>
      <button class="chip" data-add="10">+10 €</button>
    </div>
  </section>

  <section class="card">
    <h2>✅ Ежедневные действия</h2>
    <div id="habitsList"></div>
    <div class="add-habit-row">
      <input type="text" id="newHabitInput" placeholder="своё действие...">
      <button class="btn ghost" id="addHabitBtn">Добавить</button>
    </div>
  </section>

  <section class="card">
    <h2>📊 Активность <span class="tag" id="overallStreakTag"></span></h2>
    <div class="heatmap-scroll"><div class="heatmap" id="heatmap"></div></div>
    <div class="heat-legend">
      меньше
      <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span>
      больше
    </div>
  </section>

  <section class="card">
    <details class="settings">
      <summary>Настройки целей</summary>
      <div class="settings-grid">
        <label>Видео в TikTok, в день
          <input type="number" id="setVideoGoal" min="1" max="30">
        </label>
        <label>Видео в Instagram, в день
          <input type="number" id="setInstagramGoal" min="1" max="30">
        </label>
        <label>Денежная цель, €
          <input type="number" id="setMoneyTarget" min="0" step="50">
        </label>
        <label>Дедлайн денежной цели
          <input type="date" id="setMoneyDeadline">
        </label>
        <button class="btn" id="saveSettingsBtn">Сохранить</button>
      </div>
    </details>
  </section>

  <div style="text-align:center;font-size:0.65rem;color:var(--muted);opacity:0.5;margin-top:-6px;">build v13</div>

</div>

<script>
(function(){
  var KEY = 'habitTrackerData';
  var DAY = 86400000;

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
  function uid(){ return 'h_'+Math.random().toString(36).slice(2,9); }

  function defaultState(){
    return {
      settings: {
        videoGoalPerDay: 4,
        instagramGoalPerDay: 2,
        money: { target: 3000, deadline: '2026-08-30', current: 0 }
      },
      habits: [
        { id:'h1', name:'Отснял материал для видео' },
        { id:'h2', name:'Накидал сценарий / идею' },
        { id:'h3', name:'Проверил статистику и тренды' },
        { id:'h4', name:'Сегодня без бесцельного скролла' }
      ],
      logs: {},
      migrations: {}
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var def = defaultState();
      parsed.settings = Object.assign({}, def.settings, parsed.settings, {
        money: Object.assign({}, def.settings.money, (parsed.settings||{}).money)
      });
      if(!parsed.habits) parsed.habits = def.habits;
      if(!parsed.logs) parsed.logs = {};
      if(!parsed.migrations) parsed.migrations = {};
      if(!parsed.migrations.goalV2){
        parsed.settings.videoGoalPerDay = 4;
        parsed.migrations.goalV2 = true;
      }
      return parsed;
    }catch(e){
      return defaultState();
    }
  }

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ /* storage unavailable (e.g. sandboxed preview) — keep working in-memory */ }
  }

  function getLog(key){
    if(!state.logs[key]) state.logs[key] = { videos:0, habits:{}, celebrated:false };
    return state.logs[key];
  }

  function isProductive(key){
    var log = state.logs[key];
    if(!log) return false;
    if(log.videos > 0) return true;
    if(log.videosInstagram > 0) return true;
    for(var id in log.habits){ if(log.habits[id]) return true; }
    return false;
  }

  function computeStreak(){
    var today = startOfDay(new Date());
    var todayK = dateKey(today);
    var todayOk = isProductive(todayK);
    var streak = 0;
    var cursor = new Date(today.getTime() - DAY);
    while(isProductive(dateKey(cursor))){
      streak++;
      cursor = new Date(cursor.getTime() - DAY);
    }
    if(todayOk) streak++;
    return streak;
  }

  function getDayEarned(key){
    var log = state.logs[key];
    return (log && typeof log.earned === 'number') ? log.earned : 0;
  }

  function computeTotalEarned(){
    var total = 0;
    for(var key in state.logs){ total += getDayEarned(key); }
    return total;
  }

  var state = load();
  var todayK = dateKey(new Date());
  getLog(todayK);
  if(computeTotalEarned() === 0 && state.settings.money.current > 0){
    getLog(todayK).earned = state.settings.money.current;
  }
  save();

  var confettiColors = ['#fe2c55','#25f4ee','#ffd166','#33e0a3'];
  function celebrate(){
    for(var i=0;i<40;i++){
      (function(){
        var el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = (Math.random()*100)+'vw';
        el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
        var dur = 1.6 + Math.random()*1.2;
        el.style.animation = 'fall '+dur+'s ease-in forwards';
        el.style.animationDelay = (Math.random()*0.4)+'s';
        document.body.appendChild(el);
        setTimeout(function(){ el.remove(); }, (dur+0.5)*1000);
      })();
    }
  }

  function renderHeader(){
    var now = new Date();
    document.getElementById('todayDate').textContent = now.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
    var log = getLog(todayK);
    var goal = state.settings.videoGoalPerDay;
    var greet;
    if(log.videos >= goal) greet = 'План на сегодня выполнен 🎉';
    else if(log.videos > 0) greet = 'Уже в деле — продолжай 🔥';
    else greet = 'Погнали, первое видео за день 💪';
    document.getElementById('greetMsg').textContent = greet;

    var streak = computeStreak();
    document.getElementById('streakVal').textContent = streak;
    var badge = document.getElementById('streakBadge');
    badge.classList.toggle('zero', streak === 0);
    document.getElementById('overallStreakTag').textContent = streak > 0 ? ('стрик: '+streak+' дн.') : '';
  }

  function renderVideoCard(field, goal, ids){
    var log = getLog(todayK);
    var count = log[field] || 0;
    document.getElementById(ids.tag).textContent = 'цель: '+goal+'/день';
    document.getElementById(ids.count).textContent = count+'/'+goal;
    var msg = document.getElementById(ids.msg);
    if(count >= goal) msg.textContent = 'Отлично! Цель на сегодня закрыта.';
    else msg.textContent = 'Осталось ещё ' + (goal - count) + ' видео до цели.';

    var bars = document.getElementById(ids.bars);
    bars.innerHTML = '';
    var days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    var today = startOfDay(new Date());
    var monday = new Date(today.getTime() - ((today.getDay()+6)%7)*DAY);
    for(var i=0;i<7;i++){
      var d = new Date(monday.getTime() + i*DAY);
      var k = dateKey(d);
      var v = state.logs[k] ? (state.logs[k][field] || 0) : 0;
      var pct = Math.min(1, v/goal) * 100;
      var col = document.createElement('div');
      col.className = 'bar-col' + (k === todayK ? ' today' : '');
      var bar = document.createElement('div');
      bar.className = 'bar' + (v >= goal ? ' hit' : '');
      bar.style.height = Math.max(4, pct*0.4) + 'px';
      var lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = days[i];
      col.appendChild(bar);
      col.appendChild(lbl);
      bars.appendChild(col);
    }
  }

  function renderMoney(){
    var m = state.settings.money;
    var current = computeTotalEarned();
    var pct = m.target > 0 ? Math.min(100, Math.max(0, (current/m.target)*100)) : 0;
    document.getElementById('moneyFill').style.width = pct+'%';
    document.getElementById('moneyCurrentLbl').textContent = Math.round(current)+' €';
    document.getElementById('moneyTargetLbl').textContent = Math.round(m.target)+' €';

    var deadline = startOfDay(new Date(m.deadline+'T00:00:00'));
    var today = startOfDay(new Date());
    var daysLeft = Math.round((deadline - today)/DAY);
    var deadlineFmt = deadline.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
    document.getElementById('moneyDeadlineTag').textContent = 'до '+deadlineFmt;

    var remaining = Math.max(0, m.target - current);
    if(remaining <= 0){
      document.getElementById('moneyDaysLeft').textContent = 'Цель достигнута 🎉';
      document.getElementById('moneyPerDay').textContent = '';
    } else if(daysLeft <= 0){
      document.getElementById('moneyDaysLeft').textContent = 'Срок истёк';
      document.getElementById('moneyPerDay').textContent = 'Осталось: '+Math.round(remaining)+' €';
    } else {
      document.getElementById('moneyDaysLeft').textContent = daysLeft+' дн. осталось';
      document.getElementById('moneyPerDay').textContent = '~'+Math.ceil(remaining/daysLeft)+' €/день';
    }
  }

  function renderPNL(){
    var today = startOfDay(new Date());
    var monday = new Date(today.getTime() - ((today.getDay()+6)%7)*DAY);
    var week = document.getElementById('pnlWeek');
    week.innerHTML = '';
    for(var i=0;i<7;i++){
      var d = new Date(monday.getTime() + i*DAY);
      var k = dateKey(d);
      var val = getDayEarned(k);
      var cell = document.createElement('div');
      cell.className = 'pnl-day' + (val > 0 ? ' pos' : val < 0 ? ' neg' : '') + (k === todayK ? ' today' : '');
      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = d.getDate();
      var amt = document.createElement('div');
      amt.className = 'amt';
      amt.textContent = (val > 0 ? '+' : '') + Math.round(val) + '€';
      cell.appendChild(num);
      cell.appendChild(amt);
      week.appendChild(cell);
    }

    document.getElementById('earnedInput').value = getDayEarned(todayK) || '';
  }

  function renderHabits(){
    var log = getLog(todayK);
    var list = document.getElementById('habitsList');
    list.innerHTML = '';
    state.habits.forEach(function(h){
      var row = document.createElement('div');
      row.className = 'habit-row';
      var on = !!log.habits[h.id];
      var check = document.createElement('div');
      check.className = 'habit-check' + (on ? ' on' : '');
      check.onclick = function(){
        log.habits[h.id] = !log.habits[h.id];
        save();
        renderAll();
      };
      var name = document.createElement('div');
      name.className = 'habit-name' + (on ? ' on' : '');
      name.textContent = h.name;
      var del = document.createElement('button');
      del.className = 'habit-del';
      del.textContent = '✕';
      del.onclick = function(){
        state.habits = state.habits.filter(function(x){ return x.id !== h.id; });
        save();
        renderAll();
      };
      row.appendChild(check);
      row.appendChild(name);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function renderHeatmap(){
    var weeks = 12;
    var totalDays = weeks*7;
    var today = startOfDay(new Date());
    var start = new Date(today.getTime() - (totalDays-1)*DAY);
    var startWeekday = (start.getDay()+6)%7;
    var el = document.getElementById('heatmap');
    el.innerHTML = '';
    for(var i=0;i<startWeekday;i++){
      var pad0 = document.createElement('div');
      pad0.className = 'cell';
      pad0.style.visibility = 'hidden';
      el.appendChild(pad0);
    }
    for(var i=0;i<totalDays;i++){
      var d = new Date(start.getTime() + i*DAY);
      var k = dateKey(d);
      var log = state.logs[k];
      var cell = document.createElement('div');
      var level = 0;
      if(log){
        var goal = state.settings.videoGoalPerDay;
        var igGoal = state.settings.instagramGoalPerDay;
        var habitTotal = state.habits.length || 1;
        var habitDone = 0;
        for(var id in log.habits){ if(log.habits[id]) habitDone++; }
        var videoScore = (Math.min(1, (log.videos||0)/goal) + Math.min(1, (log.videosInstagram||0)/igGoal)) / 2;
        var score = videoScore*0.6 + Math.min(1, habitDone/habitTotal)*0.4;
        if(score > 0.66) level = 3;
        else if(score > 0.33) level = 2;
        else if(score > 0) level = 1;
      }
      cell.className = 'cell' + (level>0 ? ' l'+level : '') + (k===todayK ? ' today' : '');
      cell.title = k;
      el.appendChild(cell);
    }
  }

  function renderAll(){
    renderHeader();
    renderVideoCard('videos', state.settings.videoGoalPerDay, { tag:'videoGoalTag', count:'videoCount', msg:'videoMsg', bars:'weekBars' });
    renderVideoCard('videosInstagram', state.settings.instagramGoalPerDay, { tag:'igGoalTag', count:'igCount', msg:'igMsg', bars:'igWeekBars' });
    renderMoney();
    renderPNL();
    renderHabits();
    renderHeatmap();
  }

  function bindVideoButtons(plusId, minusId, field, goalGetter, celebrateOnGoal){
    document.getElementById(plusId).onclick = function(){
      var log = getLog(todayK);
      var goal = goalGetter();
      var count = log[field] || 0;
      var wasBelow = count < goal;
      log[field] = count + 1;
      if(celebrateOnGoal && wasBelow && log[field] >= goal && !log.celebrated){
        log.celebrated = true;
        celebrate();
      }
      save();
      renderAll();
    };
    document.getElementById(minusId).onclick = function(){
      var log = getLog(todayK);
      log[field] = Math.max(0, (log[field] || 0) - 1);
      save();
      renderAll();
    };
  }

  bindVideoButtons('videoPlus', 'videoMinus', 'videos', function(){ return state.settings.videoGoalPerDay; }, true);
  bindVideoButtons('igPlus', 'igMinus', 'videosInstagram', function(){ return state.settings.instagramGoalPerDay; }, false);

  document.getElementById('earnedSaveBtn').onclick = function(){
    var val = parseFloat(document.getElementById('earnedInput').value);
    if(isNaN(val)) return;
    getLog(todayK).earned = val;
    save();
    renderAll();
  };
  document.querySelectorAll('.chip[data-add]').forEach(function(chip){
    chip.onclick = function(){
      var add = parseFloat(chip.getAttribute('data-add'));
      var log = getLog(todayK);
      log.earned = (typeof log.earned === 'number' ? log.earned : 0) + add;
      save();
      renderAll();
    };
  });

  document.getElementById('addHabitBtn').onclick = function(){
    var input = document.getElementById('newHabitInput');
    var val = input.value.trim();
    if(!val) return;
    state.habits.push({ id: uid(), name: val });
    input.value = '';
    save();
    renderAll();
  };
  document.getElementById('newHabitInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('addHabitBtn').click();
  });

  document.getElementById('saveSettingsBtn').onclick = function(){
    var vg = parseInt(document.getElementById('setVideoGoal').value, 10);
    var ig = parseInt(document.getElementById('setInstagramGoal').value, 10);
    var mt = parseFloat(document.getElementById('setMoneyTarget').value);
    var md = document.getElementById('setMoneyDeadline').value;
    if(vg > 0) state.settings.videoGoalPerDay = vg;
    if(ig > 0) state.settings.instagramGoalPerDay = ig;
    if(!isNaN(mt) && mt >= 0) state.settings.money.target = mt;
    if(md) state.settings.money.deadline = md;
    save();
    renderAll();
  };

  document.getElementById('setVideoGoal').value = state.settings.videoGoalPerDay;
  document.getElementById('setInstagramGoal').value = state.settings.instagramGoalPerDay;
  document.getElementById('setMoneyTarget').value = state.settings.money.target;
  document.getElementById('setMoneyDeadline').value = state.settings.money.deadline;

  renderAll();
})();
</script>
</body>
</html>
